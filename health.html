<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3b7ed8">
<link rel="manifest" href="manifest.json">
<title>家庭健康管理</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f2f5fa;
    --bg-card: #ffffff;
    --bg-card-hover: #fafcff;
    --border: #e8edf5;
    --border-active: #5b9cf5;
    --accent: #3b82f6;
    --accent-light: #eff6ff;
    --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
    --text: #1e293b;
    --text-dim: #64748b;
    --text-muted: #94a3b8;
    --danger: #ef4444;
    --danger-light: #fef2f2;
    --success: #10b981;
    --success-light: #ecfdf5;
    --warning: #f59e0b;
    --warning-light: #fffbeb;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 4px 16px rgba(0,0,0,0.06);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.08);
    --radius: 16px;
    --radius-sm: 10px;
    --radius-xs: 8px;
  }

  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "HarmonyOS Sans", sans-serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(59,130,246,0.04) 0%, transparent 50%),
      radial-gradient(circle at 85% 60%, rgba(99,102,241,0.04) 0%, transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(16,185,129,0.03) 0%, transparent 40%),
      linear-gradient(180deg, #eef3fb 0%, #f2f5fa 30%, #f8fafc 100%);
    color: var(--text);
    min-height: 100vh;
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    letter-spacing: 0.01em;
  }

  /* Subtle pattern overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.03;
    background-image:
      radial-gradient(circle at 25% 15%, #3b82f6 1px, transparent 1px),
      radial-gradient(circle at 70% 35%, #6366f1 1px, transparent 1px),
      radial-gradient(circle at 40% 55%, #10b981 1px, transparent 1px),
      radial-gradient(circle at 80% 75%, #3b82f6 1px, transparent 1px),
      radial-gradient(circle at 10% 85%, #6366f1 1px, transparent 1px),
      radial-gradient(circle at 55% 25%, #f59e0b 1px, transparent 1px),
      radial-gradient(circle at 90% 10%, #10b981 1px, transparent 1px);
    background-size: 200px 200px;
    background-position: 0 0, 40px 60px, 80px 20px, 20px 80px, 60px 40px, 100px 10px, 140px 70px;
  }

  /* ===== Header ===== */
  .app-header {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 54px 24px 0 24px;
    min-height: 110px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .app-logo {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: 0;
  }

  .app-logo .dot {
    width: 9px; height: 9px;
    background: var(--accent-gradient);
    border-radius: 3px;
    box-shadow: 0 2px 8px rgba(59,130,246,0.35);
  }

  .header-actions { display: flex; gap: 8px; }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 22px;
    border-radius: 25px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    font-family: inherit;
    white-space: nowrap;
    letter-spacing: 0.2px;
  }

  .btn-primary {
    background: var(--accent-gradient);
    color: #fff;
    box-shadow: 0 2px 12px rgba(59,130,246,0.3);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(59,130,246,0.4); }
  .btn-primary:active { transform: translateY(0); }

  .btn-outline {
    background: #fff;
    color: var(--accent);
    border: 1.5px solid var(--border);
  }
  .btn-outline:hover { border-color: var(--accent); background: var(--accent-light); }

  .btn-sm { padding: 6px 16px; font-size: 13px; border-radius: 20px; }

  .btn-danger {
    background: #fff;
    color: var(--danger);
    border: 1.5px solid #fecaca;
  }
  .btn-danger:hover { background: var(--danger-light); border-color: var(--danger); }

  .icon-btn {
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 25px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
    font-family: inherit;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  /* ===== Layout ===== */
  .main-content {
    max-width: 960px;
    margin: 0 auto;
    padding: 28px 20px;
    position: relative;
    z-index: 1;
  }

  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }

  .section-title { font-size: 26px; font-weight: 700; color: var(--text); letter-spacing: 0; }

  .section-subtitle { font-size: 15px; color: var(--text-dim); margin-top: 4px; }

  /* ===== Member Cards ===== */
  .member-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .member-card {
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: var(--shadow-sm);
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .member-card:hover {
    border-color: #c5d9f8;
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg);
  }

  .member-card:active { transform: translateY(-1px); }

  .member-avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    flex-shrink: 0;
    background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
    box-shadow: 0 2px 8px rgba(59,130,246,0.1);
  }

  .member-card-body { flex: 1; min-width: 0; }

  .member-name { font-size: 20px; font-weight: 700; margin-bottom: 2px; letter-spacing: 0; }

  .member-info { font-size: 14px; color: var(--text-dim); margin-bottom: 6px; }

  .member-tags { display: flex; flex-wrap: wrap; gap: 5px; }

  .tag {
    font-size: 12px; font-weight: 600;
    padding: 3px 10px; border-radius: 12px;
    background: var(--accent-light); color: var(--accent);
  }

  .tag.warn { background: var(--warning-light); color: var(--warning); }

  /* ===== Detail View ===== */
  .detail-view { display: none; }

  .back-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 24px;
  }

  .detail-profile {
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    margin-bottom: 20px;
    display: flex;
    gap: 24px;
    box-shadow: var(--shadow-sm);
  }

  .detail-left {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    min-width: 140px;
    flex-shrink: 0;
  }

  .detail-avatar {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    flex-shrink: 0;
    box-shadow: 0 4px 20px rgba(59,130,246,0.15);
    margin-bottom: 12px;
  }

  .detail-name { font-size: 26px; font-weight: 700; letter-spacing: 0; margin-bottom: 2px; }
  .detail-meta { font-size: 14px; color: var(--text-dim); margin-bottom: 12px; }
  .detail-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

  .detail-right {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .detail-right-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-dim);
    margin-bottom: 2px;
    letter-spacing: 0.5px;
  }

  .health-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .health-stat {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    padding: 12px 14px;
    text-align: center;
  }

  .health-stat .stat-num {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    margin-bottom: 4px;
  }

  .health-stat .stat-label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .health-stat.highlight {
    border-color: #fecaca;
    background: #fef2f2;
  }
  .health-stat.highlight .stat-num { color: #dc2626; }

  /* Record sections */
  .record-section {
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
  }

  .record-section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }

  .record-section-title {
    font-size: 15px; font-weight: 700;
    display: flex; align-items: center; gap: 10px;
  }

  .record-section-title .icon {
    width: 32px; height: 32px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }

  .empty-state { text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 13px; }

  .record-list { list-style: none; }

  .record-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 0; border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  .record-item:last-child { border-bottom: none; }
  .record-item:hover { background: rgba(59,130,246,0.015); border-radius: 8px; padding-left: 8px; padding-right: 8px; }

  .record-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-top: 5px;
    flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.04);
  }

  .record-dot.allergy { background: var(--danger); }
  .record-dot.disease { background: var(--warning); }
  .record-dot.illness { background: var(--accent); }
  .record-dot.checkup { background: var(--success); }
  .record-dot.vaccination { background: var(--success); }
  .record-dot.growth { background: var(--accent); }
  .record-dot.visit { background: var(--warning); }

  .record-body { flex: 1; min-width: 0; }
  .record-title { font-size: 15px; font-weight: 600; }
  .record-sub { font-size: 13px; color: var(--text-dim); margin-top: 3px; }
  .record-note { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .record-image { margin-top: 8px; }
  .record-image img { max-width: 200px; max-height: 150px; border-radius: var(--radius-xs); border: 1px solid var(--border); object-fit: cover; }

  .record-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .severity {
    display: inline-block;
    padding: 2px 9px; border-radius: 10px;
    font-size: 11px; font-weight: 600; margin-left: 6px;
  }
  .severity.mild { background: var(--success-light); color: var(--success); }
  .severity.moderate { background: var(--warning-light); color: var(--warning); }
  .severity.severe { background: var(--danger-light); color: var(--danger); }

  /* ===== Chart Section ===== */
  .chart-section {
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 22px; margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
    display: none;
  }
  .chart-section.active { display: block; }
  .chart-section h3 { font-size: 15px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .chart-box {
    background: #fafcff; border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); padding: 16px;
  }
  .chart-box h4 { font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 10px; }
  .chart-box canvas { max-height: 240px; }

  /* ===== Modal ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.4);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
  }

  .modal h3 { font-size: 20px; font-weight: 700; margin-bottom: 22px; letter-spacing: 0; }

  .form-group { margin-bottom: 16px; }

  .form-group label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 12px 14px;
    background: #f8fafc;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-xs);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    resize: vertical;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
  }

  .form-group input[type="file"] {
    padding: 9px 12px;
    font-size: 13px;
    cursor: pointer;
  }

  .form-group textarea { min-height: 70px; }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }

  /* ===== Confirm Dialog ===== */
  .confirm-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.4);
    backdrop-filter: blur(4px);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .confirm-overlay.active { display: flex; }

  .confirm-box {
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    text-align: center;
    max-width: 360px;
    width: 100%;
    box-shadow: var(--shadow-lg);
  }

  .confirm-box p { margin-bottom: 20px; font-size: 14px; font-weight: 500; }

  .confirm-actions { display: flex; gap: 10px; justify-content: center; }

  /* ===== Responsive ===== */
  @media (max-width: 640px) {
    .app-header { padding: 0 16px; }
    .main-content { padding: 20px 12px; }
    .member-grid { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
    .detail-profile { flex-direction: column; text-align: center; }
    .detail-left { min-width: auto; }
    .health-stats { grid-template-columns: 1fr 1fr 1fr; }
    .chart-row { grid-template-columns: 1fr; }
    .modal { padding: 22px; }
  }
</style>
</head>
<body>

<!-- ===== Header ===== -->
<header class="app-header">
  <div class="app-logo">
    <span class="dot"></span> 家庭健康管理
  </div>
  <div class="header-actions" id="headerActions">
    <button class="btn btn-outline btn-sm" onclick="importData()" style="font-size:11px;">📥 导入</button>
    <button class="btn btn-outline btn-sm" onclick="exportData()" style="font-size:11px;">📤 导出</button>
    <button class="btn btn-primary" onclick="showAddMemberModal()">+ 添加成员</button>
  </div>
</header>

<!-- ===== Main Content ===== -->
<div class="main-content">

  <!-- 成员列表视图 -->
  <div id="memberListView">
    <div class="section-header">
      <div>
        <div class="section-title">家庭成员</div>
        <div class="section-subtitle">点击卡片查看详细健康档案</div>
      </div>
    </div>
    <div class="member-grid" id="memberGrid"></div>
    <div class="empty-state" id="emptyMembers" style="display:none">还没有添加家庭成员，点击上方按钮开始</div>
  </div>

  <!-- 成员详情视图 -->
  <div class="detail-view" id="detailView">
    <div class="back-row">
      <button class="icon-btn" onclick="backToList()">←</button>
      <span style="font-size:15px;font-weight:500;">返回成员列表</span>
    </div>
    <div class="detail-profile" id="detailProfile"></div>
    <div id="detailRecords"></div>
  </div>
</div>

<!-- ===== Add/Edit Member Modal ===== -->
<div class="modal-overlay" id="memberModal">
  <div class="modal">
    <h3 id="memberModalTitle">添加家庭成员</h3>
    <form id="memberForm" onsubmit="saveMember(event)">
      <input type="hidden" id="memberId">
      <div class="form-row">
        <div class="form-group">
          <label>姓名</label>
          <input type="text" id="memberName" required placeholder="请输入姓名">
        </div>
        <div class="form-group">
          <label>性别</label>
          <select id="memberGender">
            <option value="男">男</option>
            <option value="女">女</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>出生日期</label>
          <input type="date" id="memberBirth">
        </div>
        <div class="form-group">
          <label>与我的关系</label>
          <select id="memberRelation">
            <option value="本人">本人</option>
            <option value="配偶">配偶</option>
            <option value="父亲">父亲</option>
            <option value="母亲">母亲</option>
            <option value="儿子">儿子</option>
            <option value="女儿">女儿</option>
            <option value="其他">其他</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>头像</label>
        <input type="file" id="memberPhoto" accept="image/*" onchange="previewMemberPhoto()" style="font-size:13px;">
        <div id="photoArea" style="display:none;margin-top:10px;display:flex;align-items:center;gap:12px;">
          <img id="memberPhotoPreview" src="" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:1px solid var(--border);">
          <button type="button" class="btn btn-outline btn-sm" onclick="removeMemberPhoto()">移除照片</button>
        </div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:6px;">支持 JPG/PNG，留空则使用默认头像</div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" onclick="closeModal('memberModal')">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== Add Record Modal ===== -->
<div class="modal-overlay" id="recordModal">
  <div class="modal">
    <h3 id="recordModalTitle">添加记录</h3>
    <form id="recordForm" onsubmit="saveRecord(event)">
      <input type="hidden" id="recordMemberId">
      <input type="hidden" id="recordType">
      <input type="hidden" id="recordId">
      <div class="form-group" id="recordNameGroup">
        <label id="recordNameLabel">名称</label>
        <input type="text" id="recordName" required placeholder="请输入">
      </div>
      <div class="form-group" id="severityGroup" style="display:none">
        <label>严重程度</label>
        <select id="recordSeverity">
          <option value="轻度">轻度</option>
          <option value="中度">中度</option>
          <option value="重度">重度</option>
        </select>
      </div>
      <div class="form-row" id="dateRow1">
        <div class="form-group">
          <label id="dateLabel1">日期</label>
          <input type="date" id="recordDate1">
        </div>
        <div class="form-group" id="dateGroup2">
          <label id="dateLabel2">结束日期</label>
          <input type="date" id="recordDate2">
        </div>
      </div>
      <div id="curedGroup" class="form-group" style="display:none">
        <label>是否已治愈</label>
        <select id="recordCured">
          <option value="是">是，已治愈</option>
          <option value="否">否，持续治疗中</option>
        </select>
      </div>
      <div class="form-group" id="medicationGroup" style="display:none">
        <label>用药情况</label>
        <input type="text" id="recordMedication" placeholder="请输入用药信息">
      </div>

<script>
// ==========================================
// Data Layer
// ==========================================
var STORAGE_KEY = 'family_health_v2';

function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { members: [], nextId: 1 };
  } catch (e) {
    return { members: [], nextId: 1 };
  }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function getData() { return loadData(); }

// ==========================================
// Export / Import
// ==========================================
function exportData() {
  var d = getData();
  var json = JSON.stringify(d, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  var now = new Date();
  var ts = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0') + '_' +
    String(now.getHours()).padStart(2, '0') + '-' +
    String(now.getMinutes()).padStart(2, '0');
  a.download = '家庭健康_' + ts + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  alert('数据已导出！\n\n文件: ' + a.download + '\n\n请通过微信、QQ等方式发给家人，对方点击"导入"即可。');
}

function importData() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function() {
    var file = input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var imported = JSON.parse(e.target.result);
        if (!imported.members || typeof imported.nextId !== 'number') {
          alert('文件格式不正确，请选择有效的家庭健康数据文件。');
          return;
        }
        var current = getData();
        if (current.members.length > 0) {
          if (!confirm('当前已有 ' + current.members.length + ' 位成员的数据。\n\n选择"确定"将替换全部数据\n选择"取消"则合并新增成员')) {
            // Merge: add only new members
            var existingIds = {};
            current.members.forEach(function(m) { existingIds[m.id] = true; });
            imported.members.forEach(function(m) {
              if (!existingIds[m.id]) {
                current.members.push(m);
                current.nextId = Math.max(current.nextId, m.id.replace('m', '') | 0);
              }
            });
            current.nextId = Math.max(current.nextId, imported.nextId || 1);
            saveData(current);
            renderMemberList();
            alert('已合并！新增了成员。');
            return;
          }
        }
        // Replace all
        saveData(imported);
        renderMemberList();
        if (document.getElementById('detailView').style.display === 'block') {
          document.getElementById('detailView').style.display = 'none';
          document.getElementById('memberListView').style.display = 'block';
          document.getElementById('headerActions').style.display = 'flex';
        }
        alert('数据已导入！共 ' + imported.members.length + ' 位成员。');
      } catch (err) {
        alert('文件解析失败，请选择有效的 JSON 文件。');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ==========================================
// Helpers
// ==========================================
function uid() {
  var d = getData();
  var id = 'm' + d.nextId;
  d.nextId++;
  saveData(d);
  return id;
}

function rid() {
  var d = getData();
  var id = 'r' + d.nextId;
  d.nextId++;
  saveData(d);
  return id;
}

function findMember(id, d) {
  d = d || getData();
  for (var i = 0; i < d.members.length; i++) {
    if (d.members[i].id === id) return d.members[i];
  }
  return null;
}

function calcAge(birth) {
  if (!birth) return '';
  var b = new Date(birth);
  var now = new Date();
  var age = now.getFullYear() - b.getFullYear();
  var m = now.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < b.getDate())) age--;
  return age + '岁';
}

function fmtDate(d) { return d || ''; }

var _pendingPhotoData = null;
var _pendingCheckupPhotoData = null;

function previewCheckupPhoto() {
  var file = document.getElementById('recordCheckupPhoto').files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    _pendingCheckupPhotoData = e.target.result;
    document.getElementById('checkupPhotoImg').src = e.target.result;
    document.getElementById('checkupPhotoPreview').style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function removeCheckupPhoto() {
  _pendingCheckupPhotoData = '__remove__';
  document.getElementById('recordCheckupPhoto').value = '';
  document.getElementById('checkupPhotoPreview').style.display = 'none';
}

function setCheckupPhoto(photoData) {
  if (photoData && photoData !== '__remove__') {
    document.getElementById('checkupPhotoImg').src = photoData;
    document.getElementById('checkupPhotoPreview').style.display = 'block';
    _pendingCheckupPhotoData = photoData;
  } else {
    document.getElementById('checkupPhotoPreview').style.display = 'none';
    _pendingCheckupPhotoData = null;
  }
}

function previewMemberPhoto() {
  var file = document.getElementById('memberPhoto').files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    _pendingPhotoData = e.target.result;
    document.getElementById('memberPhotoPreview').src = e.target.result;
    document.getElementById('photoArea').style.display = 'flex';
  };
  reader.readAsDataURL(file);
}

function removeMemberPhoto() {
  _pendingPhotoData = '__remove__';
  document.getElementById('memberPhoto').value = '';
  document.getElementById('photoArea').style.display = 'none';
  document.getElementById('memberPhotoPreview').src = '';
}

function setMemberPhoto(photoData) {
  if (photoData && photoData !== '__remove__') {
    document.getElementById('memberPhotoPreview').src = photoData;
    document.getElementById('photoArea').style.display = 'flex';
    _pendingPhotoData = photoData;
  } else {
    document.getElementById('photoArea').style.display = 'none';
    _pendingPhotoData = null;
  }
}

function renderMemberAvatar(m) {
  if (m.photo) {
    return '<img src="' + m.photo + '" style="width:64px;height:64px;border-radius:50%;object-fit:cover;" alt="">';
  }
  return '<span style="font-size:32px;">' + (m.avatar || '👨') + '</span>';
}

function renderDetailAvatar(m) {
  if (m.photo) {
    return '<img src="' + m.photo + '" style="width:88px;height:88px;border-radius:50%;object-fit:cover;" alt="">';
  }
  return '<span style="font-size:44px;">' + (m.avatar || '👨') + '</span>';
}

// ==========================================
// Render: Member List
// ==========================================
function renderMemberList() {
  var d = getData();
  var grid = document.getElementById('memberGrid');
  var empty = document.getElementById('emptyMembers');

  if (d.members.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  var html = '';
  d.members.forEach(function(m) {
    var tagsHtml = '';
    if (m.allergies && m.allergies.length > 0) {
      tagsHtml += '<span class="tag warn">过敏 ' + m.allergies.length + '项</span>';
    }
    if (m.diseases && m.diseases.length > 0) {
      tagsHtml += '<span class="tag">病史 ' + m.diseases.length + '项</span>';
    }
    if (m.illnesses && m.illnesses.length > 0) {
      tagsHtml += '<span class="tag">生病 ' + m.illnesses.length + '次</span>';
    }
    if (m.checkups && m.checkups.length > 0) {
      tagsHtml += '<span class="tag">体检 ' + m.checkups.length + '次</span>';
    }
    if (m.vaccinations && m.vaccinations.length > 0) {
      tagsHtml += '<span class="tag warn">疫苗 ' + m.vaccinations.length + '针</span>';
    }
    if (!tagsHtml) {
      tagsHtml = '<span style="font-size:12px;color:var(--text-muted)">暂无健康记录</span>';
    }

    var age = calcAge(m.birth);
    html += '<div class="member-card" onclick="viewMember(\'' + m.id + '\')">' +
      '<div class="member-avatar">' + renderMemberAvatar(m) + '</div>' +
      '<div class="member-card-body">' +
        '<div class="member-name">' + escHtml(m.name) + '</div>' +
        '<div class="member-info">' + (m.gender || '') + ' · ' + (age || '未知') + ' · ' + escHtml(m.relation || '') + '</div>' +
        '<div class="member-tags">' + tagsHtml + '</div>' +
      '</div>' +
    '</div>';
  });
  grid.innerHTML = html;
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ==========================================
// Render: Member Detail

function renderRecordItem(memberId, rec, type) {
  var sevHtml = '';
  if (type === 'allergy' && rec.severity) {
    var sevCls = '';
    if (rec.severity === '轻度') sevCls = 'mild';
    else if (rec.severity === '中度') sevCls = 'moderate';
    else sevCls = 'severe';
    sevHtml = '<span class="severity ' + sevCls + '">' + rec.severity + '</span>';
  }

  var title = escHtml(rec.name || '');
  var subParts = [];
  if (rec.date1) subParts.push(rec.date1);
  if (rec.date2) subParts.push('至 ' + rec.date2);
  if (rec.cured) subParts.push(rec.cured === '是' ? '已治愈' : '持续治疗中');
  if (rec.hospital) subParts.push(escHtml(rec.hospital));
  if (rec.doctor) subParts.push(escHtml(rec.doctor));
  if (rec.department) subParts.push(escHtml(rec.department));
  if (rec.height) subParts.push(rec.height + 'cm');
  if (rec.weight) subParts.push(rec.weight + 'kg');
  if (rec.cost) subParts.push('¥' + rec.cost);
  var sub = subParts.join(' · ');

  var noteHtml = '';
  if (rec.medication) {
    noteHtml += '<div class="record-note">用药：' + escHtml(rec.medication) + '</div>';
  }
  if (rec.indicators) {
    noteHtml += '<div class="record-note">指标：' + escHtml(rec.indicators) + '</div>';
  }
  if (rec.photo) {
    noteHtml += '<div class="record-image"><img src="' + rec.photo + '" alt="体检报告" onclick="window.open(this.src)"></div>';
  }
  if (rec.location) {
    noteHtml += '<div class="record-note">接种地点：' + escHtml(rec.location) + '</div>';
  }
  if (rec.batch) {
    noteHtml += '<div class="record-note">疫苗批号：' + escHtml(rec.batch) + '</div>';
  }
  if (rec.nextDate) {
    noteHtml += '<div class="record-note">下剂日期：' + rec.nextDate + '</div>';
  }
  if (rec.note) {
    noteHtml += '<div class="record-note">备注：' + escHtml(rec.note) + '</div>';
  }

  return '<div class="record-item">' +
    '<span class="record-dot ' + type + '"></span>' +
    '<div class="record-body">' +
      '<span class="record-title">' + title + sevHtml + '</span>' +
      (sub ? '<div class="record-sub">' + sub + '</div>' : '') +
      noteHtml +
    '</div>' +
    '<div class="record-actions">' +
      '<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();showEditRecordModal(\'' + memberId + '\', \'' + type + '\', \'' + rec.id + '\')">编辑</button>' +
      '<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();confirmDeleteRecord(\'' + memberId + '\', \'' + type + '\', \'' + rec.id + '\')">删除</button>' +
    '</div>' +
  '</div>';
}

var _growthChartInstance = null;

function toggleCharts(memberId) {
  var section = document.getElementById('chartSection');
  if (section.classList.contains('active')) {
    section.classList.remove('active');
    return;
  }
  section.classList.add('active');
  setTimeout(function() { renderCharts(memberId); }, 100);
}

function renderCharts(memberId) {
  var m = findMember(memberId);
  if (!m) return;

  // Growth chart
  var growth = (m.growth || []).slice().sort(function(a, b) {
    return (a.date1 || '').localeCompare(b.date1 || '');
  });

  if (_growthChartInstance) { _growthChartInstance.destroy(); _growthChartInstance = null; }

  var canvas = document.getElementById('growthChart');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');

  if (growth.length === 0) {
    ctx.font = '13px sans-serif';
    ctx.fillStyle = '#99a8bf';
    ctx.textAlign = 'center';
    ctx.fillText('暂无身高体重数据', canvas.width / 2, canvas.height / 2);
    return;
  }

  var labels = growth.map(function(g) { return g.date1 || ''; });
  var heights = growth.map(function(g) { return parseFloat(g.height) || null; });
  var weights = growth.map(function(g) { return parseFloat(g.weight) || null; });

  _growthChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        {
          label: '身高 (cm)',
          data: heights,
          borderColor: '#3b7ed8',
          backgroundColor: 'rgba(59,126,216,0.08)',
          tension: 0.3,
          fill: true,
          yAxisID: 'y'
        },
        {
          label: '体重 (kg)',
          data: weights,
          borderColor: '#28a87a',
          backgroundColor: 'rgba(40,168,122,0.06)',
          tension: 0.3,
          fill: true,
          yAxisID: 'y1'
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { intersect: false, mode: 'index' },
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, padding: 16, usePointStyle: true, font: { size: 11 } } } },
      scales: {
        y: { type: 'linear', position: 'left', title: { display: true, text: 'cm', font: { size: 11 } }, grid: { color: 'rgba(0,0,0,0.04)' } },
        y1: { type: 'linear', position: 'right', title: { display: true, text: 'kg', font: { size: 11 } }, grid: { drawOnChartArea: false } },
        x: { grid: { display: false } }
      }
    }
  });

  // Checkup summary
  var checkups = (m.checkups || []).slice().sort(function(a, b) {
    return (a.date1 || '').localeCompare(b.date1 || '');
  });
  var summaryHtml = '';
  if (checkups.length === 0) {
    summaryHtml = '<span style="color:#99a8bf;">暂无体检数据</span>';
  } else {
    checkups.forEach(function(c) {
      summaryHtml += '<div style="margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border);">' +
        '<strong>' + escHtml(c.name || '体检') + '</strong> ' +
        '<span style="font-size:11px;color:var(--text-muted);">' + (c.date1 || '') + ' ' + escHtml(c.hospital || '') + '</span>' +
        (c.indicators ? '<div style="margin-top:2px;">' + escHtml(c.indicators) + '</div>' : '') +
      '</div>';
    });
  }
  var summaryEl = document.getElementById('checkupSummary');
  if (summaryEl) summaryEl.innerHTML = summaryHtml;
}

function saveMember(e) {
  e.preventDefault();
  var d = getData();
  var id = document.getElementById('memberId').value;

  var member = {
    id: id || uid(),
    name: document.getElementById('memberName').value.trim(),
    gender: document.getElementById('memberGender').value,
    birth: document.getElementById('memberBirth').value,
    relation: document.getElementById('memberRelation').value,
    avatar: '👨'
  };

  // Handle photo
  if (_pendingPhotoData === '__remove__') {
    member.photo = '';
    _pendingPhotoData = null;
  } else if (_pendingPhotoData) {
    member.photo = _pendingPhotoData;
    _pendingPhotoData = null;
  }

  if (id) {
    // Update existing
    for (var i = 0; i < d.members.length; i++) {
      if (d.members[i].id === id) {
        if (!member.photo && member.photo !== '') member.photo = d.members[i].photo || '';
        member.allergies = d.members[i].allergies || [];
        member.diseases = d.members[i].diseases || [];
        member.illnesses = d.members[i].illnesses || [];
        member.checkups = d.members[i].checkups || [];
        member.vaccinations = d.members[i].vaccinations || [];
        member.growth = d.members[i].growth || [];
        member.visits = d.members[i].visits || [];
        d.members[i] = member;
        break;
      }
    }
  } else {
    // New
    member.photo = _pendingPhotoData || '';
    member.allergies = [];
    member.diseases = [];
    member.illnesses = [];
    member.checkups = [];
    member.vaccinations = [];
    member.growth = [];
    member.visits = [];
    d.members.push(member);
  }

  saveData(d);
  closeModal('memberModal');

  if (document.getElementById('detailView').style.display === 'block') {
    viewMember(member.id);
  } else {
    renderMemberList();
  }
}

var _pendingDeleteMemberId = null;

function confirmDeleteMember(id) {

function execConfirm() {
  if (_pendingDeleteMemberId) {
    deleteMember(_pendingDeleteMemberId);
    _pendingDeleteMemberId = null;

  if (_pendingDeleteRecord) {

  closeConfirm();
}

function deleteMember(id) {
  var d = getData();
  d.members = d.members.filter(function(m) { return m.id !== id; });
  saveData(d);
  backToList();
}

function configureRecordForm(type) {
  var els = {
    nameGroup: document.getElementById('recordNameGroup'),
    nameLabel: document.getElementById('recordNameLabel'),
    sevGroup: document.getElementById('severityGroup'),
    dateRow1: document.getElementById('dateRow1'),
    dateGroup2: document.getElementById('dateGroup2'),
    dateLabel1: document.getElementById('dateLabel1'),
    dateLabel2: document.getElementById('dateLabel2'),
    curedGroup: document.getElementById('curedGroup'),
    medGroup: document.getElementById('medicationGroup'),
    hospitalGroup: document.getElementById('hospitalGroup'),
    indicatorsGroup: document.getElementById('indicatorsGroup'),
    locationGroup: document.getElementById('locationGroup'),
    batchGroup: document.getElementById('batchGroup'),
    nextDateGroup: document.getElementById('nextDateGroup'),
    heightWeightGroup: document.getElementById('heightWeightGroup'),
    doctorDeptGroup: document.getElementById('doctorDeptGroup'),
    costGroup: document.getElementById('costGroup'),
    checkupPhotoGroup: document.getElementById('checkupPhotoGroup')
  };

  document.getElementById('recordName').required = true;
  // Hide all optional groups
  for (var k in els) {
    if (k === 'nameGroup' || k === 'nameLabel' || k === 'dateRow1' || k === 'dateGroup2' || k === 'dateLabel1' || k === 'dateLabel2') continue;
    els[k].style.display = 'none';
  }
  els.nameGroup.style.display = 'block';
  els.dateRow1.style.display = 'grid';
  els.dateGroup2.style.display = 'block';

  if (type === 'allergy') {
    els.nameLabel.textContent = '过敏源名称';
    els.sevGroup.style.display = 'block';
    els.dateLabel1.textContent = '发现日期';
    els.dateGroup2.style.display = 'none';
  } else if (type === 'disease') {
    els.nameLabel.textContent = '疾病名称';
    els.dateLabel1.textContent = '确诊日期';
    els.dateGroup2.style.display = 'none';
    els.curedGroup.style.display = 'block';
  } else if (type === 'illness') {
    // illness
    nameLabel.textContent = '病症描述';
    dateLabel1.textContent = '开始日期';
    dateLabel2.textContent = '结束日期';
    els.medGroup.style.display = 'block';
  } else if (type === 'checkup') {
    els.nameLabel.textContent = '体检名称';
    els.dateLabel1.textContent = '体检日期';
    els.dateGroup2.style.display = 'none';
    els.hospitalGroup.style.display = 'block';
    els.indicatorsGroup.style.display = 'block';
    els.checkupPhotoGroup.style.display = 'block';
  } else if (type === 'vaccination') {
    els.nameLabel.textContent = '疫苗名称';
    els.dateLabel1.textContent = '接种日期';
    els.dateGroup2.style.display = 'none';
    els.locationGroup.style.display = 'block';
    els.batchGroup.style.display = 'block';
    els.nextDateGroup.style.display = 'block';
  } else if (type === 'growth') {
    els.nameGroup.style.display = 'none';
    document.getElementById('recordName').required = false;
    els.dateLabel1.textContent = '记录日期';
    els.dateGroup2.style.display = 'none';
    els.heightWeightGroup.style.display = 'grid';
  } else if (type === 'visit') {
    els.nameLabel.textContent = '就诊原因';
    els.dateLabel1.textContent = '就诊日期';
    els.dateGroup2.style.display = 'none';
    els.hospitalGroup.style.display = 'block';
    els.doctorDeptGroup.style.display = 'grid';
    els.costGroup.style.display = 'block';
  }
}

function saveRecord(e) {
  e.preventDefault();
  var d = getData();
  var memberId = document.getElementById('recordMemberId').value;
  var type = document.getElementById('recordType').value;
  var recordId = document.getElementById('recordId').value;

  var m = findMember(memberId, d);
  if (!m) return;

  var rec = {
    id: recordId || rid(),
    name: document.getElementById('recordName').value.trim(),
    note: document.getElementById('recordNote').value.trim()
  };

  if (type === 'allergy') {
    rec.severity = document.getElementById('recordSeverity').value;
    rec.date1 = document.getElementById('recordDate1').value;
  } else if (type === 'disease') {
    rec.date1 = document.getElementById('recordDate1').value;
    rec.cured = document.getElementById('recordCured').value;
  } else if (type === 'illness') {
    rec.date1 = document.getElementById('recordDate1').value;
    rec.date2 = document.getElementById('recordDate2').value;
    rec.medication = document.getElementById('recordMedication').value.trim();
  } else if (type === 'checkup') {
    rec.date1 = document.getElementById('recordDate1').value;
    rec.hospital = document.getElementById('recordHospital').value.trim();
    rec.indicators = document.getElementById('recordIndicators').value.trim();
    if (_pendingCheckupPhotoData === '__remove__') { rec.photo = ''; _pendingCheckupPhotoData = null; }
    else if (_pendingCheckupPhotoData) { rec.photo = _pendingCheckupPhotoData; _pendingCheckupPhotoData = null; }
  } else if (type === 'vaccination') {
    rec.date1 = document.getElementById('recordDate1').value;
    rec.location = document.getElementById('recordLocation').value.trim();
    rec.batch = document.getElementById('recordBatch').value.trim();
    rec.nextDate = document.getElementById('recordNextDate').value;
  } else if (type === 'growth') {
    rec.date1 = document.getElementById('recordDate1').value;
    rec.height = document.getElementById('recordHeight').value;
    rec.weight = document.getElementById('recordWeight').value;
  } else if (type === 'visit') {
    rec.date1 = document.getElementById('recordDate1').value;
    rec.hospital = document.getElementById('recordHospital').value.trim();
    rec.department = document.getElementById('recordDepartment').value.trim();
    rec.doctor = document.getElementById('recordDoctor').value.trim();
    rec.cost = document.getElementById('recordCost').value;
  }

  var listMap = {
    allergy: m.allergies, disease: m.diseases, illness: m.illnesses,
    checkup: m.checkups, vaccination: m.vaccinations, growth: m.growth, visit: m.visits
  };
  var list = listMap[type];

  if (recordId) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === recordId) { list[i] = rec; break; }
    }
  } else {
    list.push(rec);
  }

  saveData(d);
  closeModal('recordModal');
  viewMember(memberId);
}

var _pendingDeleteRecord = null;

function confirmDeleteRecord(memberId, type, recordId) {
  _pendingDeleteRecord = { memberId: memberId, type: type, recordId: recordId };
  document.getElementById('confirmMsg').textContent = '确定要删除这条记录吗？';
  document.getElementById('confirmDialog').classList.add('active');
}

function execDeleteRecord() {
  if (!_pendingDeleteRecord) return;
  var p = _pendingDeleteRecord;
  var d = getData();
  var m = findMember(p.memberId, d);
  if (!m) return;
  var listMap = {
    allergy: m.allergies, disease: m.diseases, illness: m.illnesses,
    checkup: m.checkups, vaccination: m.vaccinations, growth: m.growth, visit: m.visits
  };
  var setMap = {
    allergy: 'allergies', disease: 'diseases', illness: 'illnesses',
    checkup: 'checkups', vaccination: 'vaccinations', growth: 'growth', visit: 'visits'
  };
  var list = listMap[p.type];
  var filtered = [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].id !== p.recordId) filtered.push(list[i]);
  }
  m[setMap[p.type]] = filtered;

  saveData(d);
  viewMember(p.memberId);
  _pendingDeleteRecord = null;
}
