<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭健康管理</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #f0f4fa;
    --bg-card: #ffffff;
    --bg-card-hover: #f8fafe;
    --border: rgba(74, 144, 226, 0.18);
    --border-active: rgba(74, 144, 226, 0.55);
    --accent: #3b7ed8;
    --accent-dim: rgba(59, 126, 216, 0.08);
    --text: #1a2740;
    --text-dim: #5c6f8c;
    --text-muted: #99a8bf;
    --danger: #d94053;
    --success: #28a87a;
    --warning: #d48535;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ===== Header ===== */
  .app-header {
    background: rgba(255, 255, 255, 0.92);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .app-logo {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .app-logo .dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent);
  }

  .header-actions {
    display: flex;
    gap: 12px;
  }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s;
    font-family: inherit;
    white-space: nowrap;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: #5a9ef0; }

  .btn-outline {
    background: transparent;
    color: var(--accent);
    border-color: var(--border-active);
  }
  .btn-outline:hover { background: var(--accent-dim); }

  .btn-sm {
    padding: 4px 12px;
    font-size: 12px;
    border-radius: 6px;
  }

  .btn-danger {
    background: transparent;
    color: var(--danger);
    border-color: rgba(224, 85, 106, 0.3);
  }
  .btn-danger:hover { background: rgba(224, 85, 106, 0.1); }

  .icon-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s;
    font-family: inherit;
  }
  .icon-btn:hover { border-color: var(--border-active); color: var(--text); }

  /* ===== Layout ===== */
  .main-content {
    max-width: 1000px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .section-title {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
  }

  .section-subtitle {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* ===== Member Cards ===== */
  .member-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .member-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
  }

  .member-card:hover {
    border-color: var(--border-active);
    background: var(--bg-card-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
  }

  .member-avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    background: var(--accent-dim);
    margin-bottom: 14px;
  }

  .member-name {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .member-info {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .member-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid rgba(74, 144, 226, 0.15);
  }

  .tag.warn {
    background: rgba(240, 160, 80, 0.1);
    color: var(--warning);
    border-color: rgba(240, 160, 80, 0.2);
  }

  /* ===== Detail View ===== */
  .detail-view { display: none; }

  .back-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .detail-profile {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    margin-bottom: 24px;
    display: flex;
    gap: 24px;
    align-items: center;
    flex-wrap: wrap;
  }

  .detail-avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--accent-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    flex-shrink: 0;
  }

  .detail-info { flex: 1; min-width: 200px; }
  .detail-name { font-size: 22px; font-weight: 600; }
  .detail-meta { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

  /* Record sections */
  .record-section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .record-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .record-section-title {
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .record-section-title .icon {
    width: 28px; height: 28px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  .empty-state {
    text-align: center;
    padding: 32px 16px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .record-list { list-style: none; }

  .record-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px;
    border-bottom: 1px solid var(--border);
    transition: background 0.2s;
  }

  .record-item:last-child { border-bottom: none; }
  .record-item:hover { background: rgba(74, 144, 226, 0.03); }

  .record-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-top: 6px;
    flex-shrink: 0;
  }

  .record-dot.allergy { background: var(--danger); }
  .record-dot.disease { background: var(--warning); }
  .record-dot.illness { background: var(--accent); }
  .record-dot.checkup { background: var(--success); }
  .record-dot.vaccination { background: var(--success); }
  .record-dot.growth { background: var(--accent); }
  .record-dot.visit { background: var(--warning); }

  .record-body { flex: 1; min-width: 0; }
  .record-title { font-size: 14px; font-weight: 500; }
  .record-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .record-note { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-style: italic; }

  .record-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }

  .severity {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
    margin-left: 6px;
  }
  .severity.mild { background: rgba(52, 200, 149, 0.15); color: var(--success); }
  .severity.moderate { background: rgba(240, 160, 80, 0.15); color: var(--warning); }
  .severity.severe { background: rgba(224, 85, 106, 0.15); color: var(--danger); }

  /* ===== Modal ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(4px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 460px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
  }

  .modal h3 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 24px;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 10px 14px;
    background: #f5f7fc;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
    resize: vertical;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--border-active);
  }

  .form-group textarea { min-height: 70px; }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 24px;
  }

  /* ===== Confirm Dialog ===== */
  .confirm-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .confirm-overlay.active { display: flex; }

  .confirm-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    text-align: center;
    max-width: 360px;
    width: 100%;
  }

  .confirm-box p { margin-bottom: 20px; font-size: 14px; }

  .confirm-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  /* ===== Responsive ===== */
  @media (max-width: 640px) {
    .app-header { padding: 0 16px; }
    .main-content { padding: 20px 14px; }
    .member-grid { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
    .detail-profile { flex-direction: column; text-align: center; }
    .modal { padding: 24px; }
  }
</style>
</head>
<body>

<!-- ===== Header ===== -->
<header class="app-header">
  <div class="app-logo">
    <span class="dot"></span> 家庭健康管理
  </div>
  <div class="header-actions" id="headerActions">
    <button class="btn btn-primary" onclick="showAddMemberModal()">+ 添加成员</button>
  </div>
</header>

<!-- ===== Main Content ===== -->
<div class="main-content">

  <!-- 成员列表视图 -->
  <div id="memberListView">
    <div class="section-header">
      <div>
        <div class="section-title">家庭成员</div>
        <div class="section-subtitle">点击卡片查看详细健康档案</div>
      </div>
    </div>
    <div class="member-grid" id="memberGrid"></div>
    <div class="empty-state" id="emptyMembers" style="display:none">还没有添加家庭成员，点击上方按钮开始</div>
  </div>

  <!-- 成员详情视图 -->
  <div class="detail-view" id="detailView">
    <div class="back-row">
      <button class="icon-btn" onclick="backToList()">←</button>
      <span style="font-size:15px;font-weight:500;">返回成员列表</span>
    </div>
    <div class="detail-profile" id="detailProfile"></div>
    <div id="detailRecords"></div>
  </div>
</div>

<!-- ===== Add/Edit Member Modal ===== -->
<div class="modal-overlay" id="memberModal">
  <div class="modal">
    <h3 id="memberModalTitle">添加家庭成员</h3>
    <form id="memberForm" onsubmit="saveMember(event)">
      <input type="hidden" id="memberId">
      <div class="form-row">
        <div class="form-group">
          <label>姓名</label>
          <input type="text" id="memberName" required placeholder="请输入姓名">
        </div>
        <div class="form-group">
          <label>性别</label>
          <select id="memberGender">
            <option value="男">男</option>
            <option value="女">女</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>出生日期</label>
          <input type="date" id="memberBirth">
        </div>
        <div class="form-group">
          <label>与我的关系</label>
          <select id="memberRelation">
            <option value="本人">本人</option>
            <option value="配偶">配偶</option>
            <option value="父亲">父亲</option>
            <option value="母亲">母亲</option>
            <option value="儿子">儿子</option>
            <option value="女儿">女儿</option>
            <option value="其他">其他</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>头像</label>
        <input type="file" id="memberPhoto" accept="image/*" onchange="previewMemberPhoto()" style="font-size:13px;">
        <div id="photoArea" style="display:none;margin-top:10px;display:flex;align-items:center;gap:12px;">
          <img id="memberPhotoPreview" src="" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:1px solid var(--border);">
          <button type="button" class="btn btn-outline btn-sm" onclick="removeMemberPhoto()">移除照片</button>
        </div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:6px;">支持 JPG/PNG，留空则使用默认头像</div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" onclick="closeModal('memberModal')">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== Add Record Modal ===== -->
<div class="modal-overlay" id="recordModal">
  <div class="modal">
    <h3 id="recordModalTitle">添加记录</h3>
    <form id="recordForm" onsubmit="saveRecord(event)">
      <input type="hidden" id="recordMemberId">
      <input type="hidden" id="recordType">
      <input type="hidden" id="recordId">
      <div class="form-group" id="recordNameGroup">
        <label id="recordNameLabel">名称</label>
        <input type="text" id="recordName" required placeholder="请输入">
      </div>
      <div class="form-group" id="severityGroup" style="display:none">
        <label>严重程度</label>
        <select id="recordSeverity">
          <option value="轻度">轻度</option>
          <option value="中度">中度</option>
          <option value="重度">重度</option>
        </select>
      </div>
      <div class="form-row" id="dateRow1">
        <div class="form-group">
          <label id="dateLabel1">日期</label>
          <input type="date" id="recordDate1">
        </div>
        <div class="form-group" id="dateGroup2">
          <label id="dateLabel2">结束日期</label>
          <input type="date" id="recordDate2">
        </div>
      </div>
      <div id="curedGroup" class="form-group" style="display:none">
        <label>是否已治愈</label>
        <select id="recordCured">
          <option value="是">是，已治愈</option>
          <option value="否">否，持续治疗中</option>
        </select>
      </div>
      <div class="form-group" id="medicationGroup" style="display:none">
        <label>用药情况</label>
        <input type="text" id="recordMedication" placeholder="请输入用药信息">
      </div>
      <div class="form-group" id="hospitalGroup" style="display:none">
        <label>医院</label>
        <input type="text" id="recordHospital" placeholder="请输入医院名称">
      </div>
      <div class="form-group" id="indicatorsGroup" style="display:none">
        <label>关键指标</label>
        <textarea id="recordIndicators" placeholder="如：血压120/80，血糖5.2，总胆固醇4.5"></textarea>
      </div>
      <div class="form-group" id="locationGroup" style="display:none">
        <label>接种地点</label>
        <input type="text" id="recordLocation" placeholder="请输入接种地点">
      </div>
      <div class="form-group" id="batchGroup" style="display:none">
        <label>疫苗批号</label>
        <input type="text" id="recordBatch" placeholder="请输入疫苗批号">
      </div>
      <div class="form-group" id="nextDateGroup" style="display:none">
        <label>下剂日期</label>
        <input type="date" id="recordNextDate">
      </div>
      <div class="form-row" id="heightWeightGroup" style="display:none">
        <div class="form-group">
          <label>身高 (cm)</label>
          <input type="number" id="recordHeight" placeholder="如：175" step="0.1">
        </div>
        <div class="form-group">
          <label>体重 (kg)</label>
          <input type="number" id="recordWeight" placeholder="如：68" step="0.1">
        </div>
      </div>
      <div class="form-row" id="doctorDeptGroup" style="display:none">
        <div class="form-group">
          <label>科室</label>
          <input type="text" id="recordDepartment" placeholder="如：内科">
        </div>
        <div class="form-group">
          <label>医生</label>
          <input type="text" id="recordDoctor" placeholder="医生姓名">
        </div>
      </div>
      <div class="form-group" id="costGroup" style="display:none">
        <label>费用 (元)</label>
        <input type="number" id="recordCost" placeholder="如：350" step="0.01">
      </div>
      <div class="form-group">
        <label>备注</label>
        <textarea id="recordNote" placeholder="可选备注信息"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" onclick="closeModal('recordModal')">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== Confirm Dialog ===== -->
<div class="confirm-overlay" id="confirmDialog">
  <div class="confirm-box">
    <p id="confirmMsg">确定要删除吗？此操作不可撤销。</p>
    <div class="confirm-actions">
      <button class="btn btn-outline" onclick="closeConfirm()">取消</button>
      <button class="btn btn-danger" id="confirmBtn" onclick="execConfirm()">确定删除</button>
    </div>
  </div>
</div>

<script>
// ==========================================
// Data Layer
// ==========================================
var STORAGE_KEY = 'family_health_v2';

function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { members: [], nextId: 1 };
  } catch (e) {
    return { members: [], nextId: 1 };
  }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function getData() { return loadData(); }

// ==========================================
// Helpers
// ==========================================
function uid() {
  var d = getData();
  var id = 'm' + d.nextId;
  d.nextId++;
  saveData(d);
  return id;
}

function rid() {
  var d = getData();
  var id = 'r' + d.nextId;
  d.nextId++;
  saveData(d);
  return id;
}

function findMember(id, d) {
  d = d || getData();
  for (var i = 0; i < d.members.length; i++) {
    if (d.members[i].id === id) return d.members[i];
  }
  return null;
}

function calcAge(birth) {
  if (!birth) return '';
  var b = new Date(birth);
  var now = new Date();
  var age = now.getFullYear() - b.getFullYear();
  var m = now.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < b.getDate())) age--;
  return age + '岁';
}

function fmtDate(d) { return d || ''; }

var _pendingPhotoData = null;

function previewMemberPhoto() {
  var file = document.getElementById('memberPhoto').files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    _pendingPhotoData = e.target.result;
    document.getElementById('memberPhotoPreview').src = e.target.result;
    document.getElementById('photoArea').style.display = 'flex';
  };
  reader.readAsDataURL(file);
}

function removeMemberPhoto() {
  _pendingPhotoData = '__remove__';
  document.getElementById('memberPhoto').value = '';
  document.getElementById('photoArea').style.display = 'none';
  document.getElementById('memberPhotoPreview').src = '';
}

function setMemberPhoto(photoData) {
  if (photoData && photoData !== '__remove__') {
    document.getElementById('memberPhotoPreview').src = photoData;
    document.getElementById('photoArea').style.display = 'flex';
    _pendingPhotoData = photoData;
  } else {
    document.getElementById('photoArea').style.display = 'none';
    _pendingPhotoData = null;
  }
}

function renderMemberAvatar(m) {
  if (m.photo) {
    return '<img src="' + m.photo + '" style="width:48px;height:48px;border-radius:50%;object-fit:cover;" alt="">';
  }
  return '<span style="font-size:24px;">' + (m.avatar || '👨') + '</span>';
}

function renderDetailAvatar(m) {
  if (m.photo) {
    return '<img src="' + m.photo + '" style="width:64px;height:64px;border-radius:50%;object-fit:cover;" alt="">';
  }
  return '<span style="font-size:32px;">' + (m.avatar || '👨') + '</span>';
}

function renderMemberList() {
  var d = getData();
  var grid = document.getElementById('memberGrid');
  var empty = document.getElementById('emptyMembers');

  if (d.members.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  var html = '';
  d.members.forEach(function(m) {
    var tagsHtml = '';
    if (m.allergies && m.allergies.length > 0) {
      tagsHtml += '<span class="tag warn">过敏 ' + m.allergies.length + '项</span>';
    }
    if (m.diseases && m.diseases.length > 0) {
      tagsHtml += '<span class="tag">病史 ' + m.diseases.length + '项</span>';
    }
    if (m.illnesses && m.illnesses.length > 0) {
      tagsHtml += '<span class="tag">生病 ' + m.illnesses.length + '次</span>';
    }
    if (m.checkups && m.checkups.length > 0) {
      tagsHtml += '<span class="tag">体检 ' + m.checkups.length + '次</span>';
    }
    if (m.vaccinations && m.vaccinations.length > 0) {
      tagsHtml += '<span class="tag warn">疫苗 ' + m.vaccinations.length + '针</span>';
    }
    if (!tagsHtml) {
      tagsHtml = '<span style="font-size:12px;color:var(--text-muted)">暂无健康记录</span>';
    }

    var age = calcAge(m.birth);
    html += '<div class="member-card" onclick="viewMember(\'' + m.id + '\')">' +
      '<div class="member-avatar">' + renderMemberAvatar(m) + '</div>' +
      '<div class="member-name">' + escHtml(m.name) + '</div>' +
      '<div class="member-info">' + (m.gender || '') + ' · ' + (age || '未知') + ' · ' + escHtml(m.relation || '') + '</div>' +
      '<div class="member-tags">' + tagsHtml + '</div>' +
    '</div>';
  });
  grid.innerHTML = html;
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderRecordItem(memberId, rec, type) {
  var sevHtml = '';
  if (type === 'allergy' && rec.severity) {
    var sevCls = '';
    if (rec.severity === '轻度') sevCls = 'mild';
    else if (rec.severity === '中度') sevCls = 'moderate';
    else sevCls = 'severe';
    sevHtml = '<span class="severity ' + sevCls + '">' + rec.severity + '</span>';
  }

  var title = escHtml(rec.name || '');
  var subParts = [];
  if (rec.date1) subParts.push(rec.date1);
  if (rec.date2) subParts.push('至 ' + rec.date2);
  if (rec.cured) subParts.push(rec.cured === '是' ? '已治愈' : '持续治疗中');
  if (rec.hospital) subParts.push(escHtml(rec.hospital));
  if (rec.doctor) subParts.push(escHtml(rec.doctor));
  if (rec.department) subParts.push(escHtml(rec.department));
  if (rec.height) subParts.push(rec.height + 'cm');
  if (rec.weight) subParts.push(rec.weight + 'kg');
  if (rec.cost) subParts.push('¥' + rec.cost);
  var sub = subParts.join(' · ');

  var noteHtml = '';
  if (rec.medication) {
    noteHtml += '<div class="record-note">用药：' + escHtml(rec.medication) + '</div>';
  }
  if (rec.indicators) {
    noteHtml += '<div class="record-note">指标：' + escHtml(rec.indicators) + '</div>';
  }
  if (rec.location) {
    noteHtml += '<div class="record-note">接种地点：' + escHtml(rec.location) + '</div>';
  }
  if (rec.batch) {
    noteHtml += '<div class="record-note">疫苗批号：' + escHtml(rec.batch) + '</div>';
  }
  if (rec.nextDate) {
    noteHtml += '<div class="record-note">下剂日期：' + rec.nextDate + '</div>';
  }
  if (rec.note) {
    noteHtml += '<div class="record-note">备注：' + escHtml(rec.note) + '</div>';
  }

  return '<div class="record-item">' +
    '<span class="record-dot ' + type + '"></span>' +
    '<div class="record-body">' +
      '<span class="record-title">' + title + sevHtml + '</span>' +
      (sub ? '<div class="record-sub">' + sub + '</div>' : '') +
      noteHtml +
    '</div>' +
    '<div class="record-actions">' +
      '<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();showEditRecordModal(\'' + memberId + '\', \'' + type + '\', \'' + rec.id + '\')">编辑</button>' +
      '<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();confirmDeleteRecord(\'' + memberId + '\', \'' + type + '\', \'' + rec.id + '\')">删除</button>' +
    '</div>' +
  '</div>';
}

function saveMember(e) {
  e.preventDefault();
  var d = getData();
  var id = document.getElementById('memberId').value;

  var member = {
    id: id || uid(),
    name: document.getElementById('memberName').value.trim(),
    gender: document.getElementById('memberGender').value,
    birth: document.getElementById('memberBirth').value,
    relation: document.getElementById('memberRelation').value,
    avatar: '👨'
  };

  // Handle photo
  if (_pendingPhotoData === '__remove__') {
    member.photo = '';
    _pendingPhotoData = null;
  } else if (_pendingPhotoData) {
    member.photo = _pendingPhotoData;
    _pendingPhotoData = null;
  }

  if (id) {
    // Update existing
    for (var i = 0; i < d.members.length; i++) {
      if (d.members[i].id === id) {
        if (!member.photo && member.photo !== '') member.photo = d.members[i].photo || '';
        member.allergies = d.members[i].allergies || [];
        member.diseases = d.members[i].diseases || [];
        member.illnesses = d.members[i].illnesses || [];
        member.checkups = d.members[i].checkups || [];
        member.vaccinations = d.members[i].vaccinations || [];
        member.growth = d.members[i].growth || [];
        member.visits = d.members[i].visits || [];
        d.members[i] = member;
        break;
      }
    }
  } else {
    // New
    member.photo = _pendingPhotoData || '';
    member.allergies = [];
    member.diseases = [];
    member.illnesses = [];
    member.checkups = [];
    member.vaccinations = [];
    member.growth = [];
    member.visits = [];
    d.members.push(member);
  }

  saveData(d);
  closeModal('memberModal');

  if (document.getElementById('detailView').style.display === 'block') {
    viewMember(member.id);
  } else {
    renderMemberList();
  }
}

  var listMap = {
    allergy: m.allergies, disease: m.diseases, illness: m.illnesses,
    checkup: m.checkups, vaccination: m.vaccinations, growth: m.growth, visit: m.visits
  };
  var list = listMap[type];

  if (recordId) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === recordId) { list[i] = rec; break; }
    }
  } else {
    list.push(rec);
  }

  saveData(d);
  closeModal('recordModal');
  viewMember(memberId);
}

var _pendingDeleteRecord = null;

function confirmDeleteRecord(memberId, type, recordId) {
  _pendingDeleteRecord = { memberId: memberId, type: type, recordId: recordId };
  document.getElementById('confirmMsg').textContent = '确定要删除这条记录吗？';
  document.getElementById('confirmDialog').classList.add('active');
}

function execDeleteRecord() {
  if (!_pendingDeleteRecord) return;
  var p = _pendingDeleteRecord;
  var d = getData();
  var m = findMember(p.memberId, d);
  if (!m) return;
  var listMap = {
    allergy: m.allergies, disease: m.diseases, illness: m.illnesses,
    checkup: m.checkups, vaccination: m.vaccinations, growth: m.growth, visit: m.visits
  };
  var setMap = {
    allergy: 'allergies', disease: 'diseases', illness: 'illnesses',
    checkup: 'checkups', vaccination: 'vaccinations', growth: 'growth', visit: 'visits'
  };
  var list = listMap[p.type];
  var filtered = [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].id !== p.recordId) filtered.push(list[i]);
  }
  m[setMap[p.type]] = filtered;

  saveData(d);
  viewMember(p.memberId);
  _pendingDeleteRecord = null;
}

// ==========================================
// Modal & Confirm Helpers
// ==========================================
function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function closeConfirm() {
  document.getElementById('confirmDialog').classList.remove('active');
  _pendingDeleteMemberId = null;
  _pendingDeleteRecord = null;
}

// Close modals on overlay click
document.getElementById('memberModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal('memberModal');
});
document.getElementById('recordModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal('recordModal');
});
document.getElementById('confirmDialog').addEventListener('click', function(e) {
  if (e.target === this) closeConfirm();
});

// ESC to close
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeModal('memberModal');
    closeModal('recordModal');
    closeConfirm();
  }
});
